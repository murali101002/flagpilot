# Prometheus scrape config for FlagPilot practice.
# Job 1: app metrics re-exposed by the OTel collector (:8889 on the compose network).
# Job 2: Prometheus self-scrape, as a sanity check.

global:
  scrape_interval: 5s # short so practice experiments show up fast

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
