# OpenTelemetry Collector config for FlagPilot practice.
# Apps send OTLP to :4318 (HTTP) / :4317 (gRPC).
# Traces are printed to the collector's logs (debug exporter).
# Metrics are re-exposed in Prometheus format on :8889 for prometheus.yml to scrape.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
